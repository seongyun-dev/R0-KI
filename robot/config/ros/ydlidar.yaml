ydlidar_ros2_driver_node:
  ros__parameters:
    port: /dev/roki_lidar
    frame_id: laser_frame
    ignore_array: ""
    baudrate: 128000
    lidar_type: 1
    device_type: 0
    isSingleChannel: true
    intensity: false
    intensity_bit: 0
    sample_rate: 5
    abnormal_check_count: 4
    # This single-channel unit varies by one or two samples per revolution.
    # Fixed resolution makes the SDK drop those frames ("Real points > fixed
    # points"), which intermittently starves /scan and RF2O/Nav2.
    fixed_resolution: false
    reversion: false
    # This unit reports bearings mirrored about its own zero. Verified 2026-08-07
    # with the robot boxed into a corner: the scan put the near wall 0.32 m to the
    # left and 0.75 m of space to the right, while the wall was physically on the
    # right. A mirror cannot be corrected by a TF, because a TF is a rotation --
    # it has to be undone here, at the driver.
    #
    # Combined with the reverse test that fixed forward at reported -90 deg, the
    # true mapping was bearing = -reported - 90. Undoing the mirror here makes it
    # bearing = reported - 90, so ROKI_LIDAR_YAW_RAD must be -pi/2 (was +pi/2) and
    # the obstacle interlock's forward centre becomes +90 deg (was -90).
    inverted: true
    auto_reconnect: true
    support_motor_dtr: false
    angle_max: 180.0
    angle_min: -180.0
    range_max: 12.0
    # 0.1 이던 값은 차체 안쪽의 반사를 통과시켰다. 2026-08-08 실측에서
    # 0.114 m 반사가 잡혔는데 그 방향 50 cm 안에는 아무것도 없었다 -- 근접
    # 노이즈다. 그런 점이 코스트맵에 찍히면 로봇 자기 셀이 치명이 되고
    # 계획기가 "Starting point in lethal space" 로 경로 생성을 거부한다.
    #
    # 이 거리의 기준은 base_link 가 아니라 laser_frame 이다. 보통은 그 차이
    # 때문에 외접원 값을 그대로 쓰면 안 되지만, 이 차체는 라이다가 중심 바로
    # 위에 있어(ROKI_LIDAR_X_M=0, Y_M=0, Z_M=0.337) 두 원점이 x/y 로 일치한다.
    # 그래서 외접원 0.215 m(사각 0.35x0.25) 에 여유 3.5 cm 를 더한 값이 그대로
    # 성립한다. 라이다를 옮기면 이 값도 다시 계산해야 한다.
    #
    # 대가: 라이다에서 0.25 m 안쪽의 진짜 장애물도 버린다. 그 영역은 라이다
    # 인터락(정지 0.3 m)이 따로 담당한다.
    #
    # 실측 효과: 정지 상태 /odom 변동이 2 초에 0.28 m 에서 14 초에 0.025 m 로
    # 줄었다. 원인은 남아 있지만(후방 87.6% 무반사 미해결) 개선은 재현됐다.
    range_min: 0.25
    frequency: 10.0
    # 이 드라이버에서는 죽은 옵션이다. 파라미터는 선언·수신되지만
    # (`ros2 param get` 이 True 를 돌려준다) /scan 을 만드는 코드가 쓰지 않는다.
    # 유효 범위 밖 샘플은 배열에 채워지지 않아 그대로 0.0 으로 남는다.
    # 2026-08-08 실측: true 로 바꿔도 410 샘플 중 148 개가 여전히 0.0 이었다.
    #
    # 값을 바꿔도 동작이 변하지 않으므로 기본값을 유지한다. 0.0 이 문제가
    # 되는 소비자가 나오면 드라이버 뒤에 필터 노드를 두는 쪽이 맞다.
    # (rf2o 는 문제가 아니다 -- non-finite 와 <=0 을 모두 null point 로
    # 제외하므로 0.0 과 inf 를 같게 다룬다.)
    invalid_range_is_inf: false
    debug: false
