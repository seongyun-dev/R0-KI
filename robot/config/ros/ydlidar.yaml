ydlidar_ros2_driver_node:
  ros__parameters:
    port: /dev/roki_lidar
    frame_id: laser_frame
    ignore_array: ""
    baudrate: 128000
    lidar_type: 1
    device_type: 0
    isSingleChannel: true
    intensity: false
    intensity_bit: 0
    sample_rate: 5
    abnormal_check_count: 4
    # This single-channel unit varies by one or two samples per revolution.
    # Fixed resolution makes the SDK drop those frames ("Real points > fixed
    # points"), which intermittently starves /scan and RF2O/Nav2.
    fixed_resolution: false
    reversion: false
    inverted: false
    auto_reconnect: true
    support_motor_dtr: false
    angle_max: 180.0
    angle_min: -180.0
    range_max: 12.0
    range_min: 0.1
    frequency: 10.0
    invalid_range_is_inf: false
    debug: false
