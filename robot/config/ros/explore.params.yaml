# Frontier exploration (explore_lite) tuned for the RO-KI Ackermann chassis.
#
# The upstream defaults assume a differential-drive robot that can pivot toward
# any frontier. This chassis cannot: minimum turning radius is
# wheelbase / tan(max road-wheel angle) = 0.124 / tan(20 deg) = 0.34 m, reverse
# is not enabled, and the mapped space is only a few metres across. The values
# below therefore bias frontier choice toward whatever lies ahead and give the
# slow drive enough time to reach it.
/**:
  ros__parameters:
    robot_base_frame: base_link

    # SLAM Toolbox publishes the growing map on these topics; explore_lite reads
    # them directly rather than owning a costmap of its own.
    costmap_topic: map
    costmap_updates_topic: map_updates

    # Off deliberately. The start pose is behind the robot once exploration has
    # moved on, and a Dubin-only chassis needs a wide arc to face backwards -- a
    # goal that fails far more often than it succeeds and that no part of the demo
    # depends on, since the mapping session is ended by the operator's save.
    return_to_init: false

    # Build up to three distinct, robot-connected FREE viewpoints for each
    # frontier cluster. They are checked in order by MappingGridBased and the
    # first feasible pose is used. Goal yaw keeps the established 8c7a466
    # robot-to-target bearing; multi-viewpoint selection must not change the
    # yaw policy in the same experiment.
    frontier_approach_distance: 0.25
    frontier_max_approaches: 3
    frontier_candidate_spacing: 0.20
    # Permit the short UNKNOWN fringe at the robot and frontier. For a detached
    # known island reached through a long UNKNOWN shortcut, follow only the
    # known-space prefix, stop 10 cm early, observe again, and replan.
    frontier_max_internal_unknown_run: 0.30
    frontier_unknown_bridge_standoff: 0.10
    frontier_planner_id: MappingGridBased
    # v0.2.8 introduced the long-lookahead controller only for mapping. Direct
    # FollowPath execution must select it too; otherwise this path would bypass
    # the mapping-specific Ackermann tuning and silently use the patrol values.
    frontier_controller_id: MappingFollowPath
    frontier_goal_checker_id: mapping_goal_checker

    # A transient planner/controller failure gets one delayed retry. Exhausted
    # candidates report exploration_stalled; they are never mislabeled as a
    # genuinely complete map.
    frontier_retry_delay: 5.0
    # If Nav2 never acknowledges cancellation, fail closed instead of keeping
    # a stale controller path alive indefinitely.
    frontier_cancel_timeout: 5.0
    frontier_max_attempts: 2

    # Failure accounting is per frontier cluster, not per viewpoint. An
    # exhausted cluster is reactivated at most once, and only when the local
    # map has gained a meaningful number of FREE cells around that frontier.
    frontier_max_reactivations: 1
    frontier_reactivation_radius: 0.50
    frontier_reactivation_min_free_cells: 8
    frontier_failure_match_radius: 0.25

    # Publishes frontier markers for RViz. Cheap and worth keeping while tuning.
    visualize: true

    # Frontier goals are reselected at this rate. The chassis moves at roughly
    # 0.08 m/s, so choosing more often than this only causes goal thrashing.
    planner_frequency: 0.15

    # Upstream 30 s assumes a faster robot. At 0.08 m/s that is barely 2.4 m, so
    # a legitimately slow approach would be blacklisted as "no progress".
    progress_timeout: 90.0

    # These two are the ONLY terms in this package's frontier cost:
    #   cost = potential_scale * min_distance * res  -  gain_scale * size * res
    # (frontier_search.cpp:192). There is no heading term at all -- see the note on
    # orientation_scale below.
    #
    # So the only way to stop picking goals this chassis cannot reach is to stop
    # rewarding closeness. A high potential_scale elects the nearest frontier, and
    # the nearest one is routinely a small pocket beside or behind the robot: the
    # space ahead is already scanned, so it is no longer a frontier. Observed live
    # twice -- goals 0.93 m at 121 deg and 1.10 m at 76 deg off-axis, both needing
    # an arc that sweeps into a wall about 1.1 m away, both correctly refused by the
    # planner while the front lay open 2.3-4.2 m.
    #
    # Weighting size instead favours the large open regions, which are further away
    # and therefore approached along a much straighter line.
    potential_scale: 0.5
    gain_scale: 3.0

    # DEAD PARAMETER -- setting it does nothing. Verified in the built source on
    # 2026-08-07: explore.cpp:69 declares it and :78 reads it into
    # orientation_scale_, but frontier_search.cpp never mentions orientation and
    # frontierCost() has no heading term. It is not passed to FrontierSearch at all.
    #
    # Kept at the upstream default purely so the file matches what the node reads.
    # A chassis that cannot pivot really does need a heading term; supplying one
    # means patching frontier_search.cpp, not editing this file.
    orientation_scale: 0.0

    # Upstream 0.75 m is larger than several openings in a room this size, so
    # real frontiers would be discarded and exploration would stop early.
    min_frontier_size: 0.35

    transform_tolerance: 0.3
