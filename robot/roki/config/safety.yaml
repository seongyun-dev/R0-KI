safety:
  # 임시 운영 후보값. ESP32 실제 송신 주기와 USB 부하 시험 후 확정한다.
  #
  # 2026-08-08 운영 조정: 300 -> 600.
  # 펌웨어는 100ms 주기로 odometry 를 보내므로 300ms 는 연속 3건 결측이면
  # 중단이었고, 실제 주행에서 그 여유가 부족했다(매핑이 56초 만에
  # ODOMETRY_TIMEOUT 으로 중단. 같은 구간 RUNTIME CENSUS 는 odom=50/5s 를
  # 유지하면서 no_data=27~30 을 함께 기록 -- 총량은 오는데 간격이 벌어졌다).
  #
  # 600 은 여전히 잠정값이다. inter-arrival 의 max/P95/P99 를 실제 CONTROL
  # 부하에서 재기 전까지 확정하지 않는다. 그 측정은 진행 중인 ESP32 시리얼
  # 안정화 작업 이후에 한다.
  #
  # 펌웨어의 DRIVE_WATCHDOG_MS(400) 는 이 값의 근거가 되지 못한다. 그것은
  # CONTROL 입력 워치독이라, CONTROL 이 계속 들어오는 동안 odometry 만
  # 끊기면 모터를 멈추지 않는다. 그 경우 로봇은 피드백 없이 계속 달린다 --
  # 이 타임아웃이 지키는 것이 바로 그 실패 모드다.
  odometry_timeout_ms: 600
  hardware_status_timeout_ms: 1000

  # TODO(calibration): Firmware battery가 실제 SoC(%)를 보내기 전까지
  # LOW_BATTERY 판정을 비활성화한다. SoC 보정 완료 후 다시 설정한다.
  low_battery_percent: null

  # Line tracing is not part of the map/waypoint product. A disconnected or
  # faulty line sensor is diagnostic-only and must not block mapping or patrol.
  require_line_sensor: false

  # TODO(calibration): 정상 부하 encoder 특성 측정 후 구현한다.
  stall_timeout_ms: null
