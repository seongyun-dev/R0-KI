robot:
  id: "ROKI-01"
  name: "RO-KI"
  timezone: "Asia/Seoul"

control:
  # ESP32의 8-bit PWM 물리 범위. 음수 명령은 후진을 뜻한다.
  # 조립 완료 후 20% PWM(약 51)에서 좌우 구동이 확인되었다.
  # 45는 ramp 중 정지구간을 짧게 넘기기 위한 보수적 최소 출력이다.
  speed_min: 45
  speed_max: 255
  # 2026-08-07 현장: 8/tick 램프는 Nav2 저속 주행을 사실상 정지시켰다.
  # REEDS_SHEPP 경로는 전·후진을 자주 바꾸는데, 부호가 바뀔 때마다 램프가
  # 0을 지나며 리셋되고, stall 하한(실측 38, 36 이하 정지)까지 기어 올라가는
  # 8→16→24→32 구간은 바퀴가 돌지 않는 죽은 시간이다. 최대 출력이 45로
  # 제한된 지금은 램프로 보호할 관성도 없으므로 목표치로 즉시 점프한다.
  # (전일 직접 구동 실측도 매번 0→45/50 스텝 입력으로 수행되었다.)
  speed_ramp_per_update: 45
  # TODO(calibration): 좌우 엔코더 극성과 정상 편차를 확인한 뒤 결정한다.
  straight_correction_kp_deg_per_tick: null
  maximum_straight_correction_deg: null

  servo_center_deg: 80
  # 2026-08-06 현장 실측: 명령 오프셋 30/40/50에서 road-wheel 15/20/30도.
  # 전달률이 오프셋 40까지 0.50으로 선형이고 50에서 0.60으로 꺾인다.
  # cmd_vel_adapter는 선형 매핑을 가정하므로 선형 구간인 +-40만 사용한다.
  # +-50(30/130)은 실제로 도달하지만 과대 조향으로 경로를 이탈했다.
  servo_min_deg: 40
  servo_max_deg: 120

navigation:
  mode: "waypoint"
  map_creation: "manual_drive_slam"
  route_file: "config/route.local.yaml"
  # 자동차형 차체는 제자리 회전이 불가능하므로 waypoint 사이를 연속 곡선으로 잇는다.
  allow_in_place_rotation: false
  waypoint_acceptance_radius_m: 0.30
  destination_acceptance_radius_m: 0.20
  # 곡선 cmd_vel은 아래 두 실측값이 채워질 때까지 fail-closed로 정지한다.
  wheelbase_m: null
  maximum_road_wheel_angle_deg: null
  maximum_linear_speed_mps: 0.40

odometry:
  # 장착된 휠의 확정 지름: 65 mm.
  wheel_diameter_m: 0.065
  # TODO(calibration): 아래 두 원자료를 데이터시트/실측으로 확인한다.
  motor_encoder_ticks_per_motor_revolution: null
  gear_ratio: null
  # 2026-08-02 수동 1회전 각 3회 실측: LEFT 329.0, RIGHT 328.0 ticks/rev.
  # 런타임은 단일 정수값을 사용하므로 전체 평균 328.5를 329로 반올림한다.
  encoder_ticks_per_revolution: 329

localization:
  map_frame: "map"
  base_frame: "base_link"
  # MQTT pose는 1초 주기이며 2초 이상 갱신되지 않은 TF는 발행하지 않는다.
  map_pose_timeout_sec: 2.0
  tf_poll_interval_sec: 0.1
  # AMCL can future-date map->odom by transform_tolerance (currently 0.5s).
  # Keep this above that value but reject clocks/TF that jump far ahead.
  max_future_transform_sec: 0.75

hardware:
  computer: "Jetson Orin Nano"
  controller: "ESP32 DevKit V1"
  motor_driver: "BTS7960 x2"
  drive_motor: "JGB37-520 Encoder Motor 12V 250RPM"
  steering_servo: "MG996R"
  line_sensor: "5-channel digital"
  line_sensor_count: 5
  battery: "3S LiPo"
  # 핀맵, PWM 채널, 모터 방향 매핑은 ESP32 펌웨어 파일을 단일 기준으로
  # 사용하며 이 설정 파일에 중복 정의하지 않는다.

state:
  initial: "IDLE"

serial_protocol:
  speed_percent:
    min: 0
    max: 100

  steering_angle_deg:
    min: -10
    max: 10

  battery_percent:
    min: 0
    max: 100

  line_sensor:
    count: 5
