robot:
  id: "ROKI-01"
  name: "RO-KI"
  timezone: "Asia/Seoul"

control:
  # ESP32의 8-bit PWM 물리 범위. 음수 명령은 후진을 뜻한다.
  # 조립 완료 후 20% PWM(약 51)에서 좌우 구동이 확인되었다.
  # 45는 ramp 중 정지구간을 짧게 넘기기 위한 보수적 최소 출력이다.
  speed_min: 45
  speed_max: 255
  # ESP32 odometry 주기(100ms)마다 최대 8 PWM씩 증가한다.
  speed_ramp_per_update: 8
  # TODO(calibration): 좌우 엔코더 극성과 정상 편차를 확인한 뒤 결정한다.
  straight_correction_kp_deg_per_tick: null
  maximum_straight_correction_deg: null

  servo_center_deg: 80
  # 기존 안전 펌웨어의 검증 제한 범위를 우선 사용한다.
  servo_min_deg: 60
  servo_max_deg: 100

line_following:
  # 2026-08-02 현장 시험에서 센서 보드가 선을 벗어나기 전에 조향할 시간이
  # 부족함을 확인했다. 원시 진단값만 보존하고 주행 제어에는 사용하지 않는다.
  enabled: false
  # 2026-08-02 정지 측정 기준: 검은색=0, 물리적 왼쪽에서 오른쪽 순서.
  black_value: 0
  weights: [-2, -1, 0, 1, 2]
  drive_speed_pwm: 45
  steering_center_deg: 80
  # 실물 정지 시험에서 60=왼쪽, 80=정면, 100=오른쪽을 확인했다.
  steering_min_deg: 60
  steering_max_deg: 100
  # 현재 관찰상 큰 각도가 오른쪽 조향. 첫 통합 시험에서 한 번 확인한다.
  steering_sign: 1
  kp_deg_per_error: 10.0
  kd_deg_per_error_delta: 1.0
  maximum_correction_deg: 20
  # 라인이 한 프레임이라도 사라지면 즉시 속도 0, 두 프레임이면 유실 확정.
  lost_confirm_frames: 2
  # 종료 마커는 첫 이동 로그를 보고 확정할 수 있도록 조정 가능한 후보값이다.
  destination_min_black_sensors: 4
  destination_confirm_frames: 3
  destination_arm_after_follow_frames: 10

navigation:
  mode: "waypoint"
  map_creation: "manual_drive_slam"
  route_file: "config/route.local.yaml"
  # 자동차형 차체는 제자리 회전이 불가능하므로 waypoint 사이를 연속 곡선으로 잇는다.
  allow_in_place_rotation: false
  waypoint_acceptance_radius_m: 0.30
  destination_acceptance_radius_m: 0.20
  # 곡선 cmd_vel은 아래 두 실측값이 채워질 때까지 fail-closed로 정지한다.
  wheelbase_m: null
  maximum_road_wheel_angle_deg: null
  maximum_linear_speed_mps: 0.40

odometry:
  # 장착된 휠의 확정 지름: 65 mm.
  wheel_diameter_m: 0.065
  # TODO(calibration): 아래 두 원자료를 데이터시트/실측으로 확인한다.
  motor_encoder_ticks_per_motor_revolution: null
  gear_ratio: null
  # 2026-08-02 수동 1회전 각 3회 실측: LEFT 329.0, RIGHT 328.0 ticks/rev.
  # 런타임은 단일 정수값을 사용하므로 전체 평균 328.5를 329로 반올림한다.
  encoder_ticks_per_revolution: 329

localization:
  map_frame: "map"
  base_frame: "base_link"
  # MQTT pose는 1초 주기이며 2초 이상 갱신되지 않은 TF는 발행하지 않는다.
  map_pose_timeout_sec: 2.0
  tf_poll_interval_sec: 0.1

hardware:
  computer: "Jetson Orin Nano"
  controller: "ESP32 DevKit V1"
  motor_driver: "BTS7960 x2"
  drive_motor: "JGB37-520 Encoder Motor 12V 250RPM"
  steering_servo: "MG996R"
  line_sensor: "5-channel digital"
  line_sensor_count: 5
  battery: "3S LiPo"
  # 핀맵, PWM 채널, 모터 방향 매핑은 ESP32 펌웨어 파일을 단일 기준으로
  # 사용하며 이 설정 파일에 중복 정의하지 않는다.

state:
  initial: "IDLE"

serial_protocol:
  speed_percent:
    min: 0
    max: 100

  steering_angle_deg:
    min: -10
    max: 10

  battery_percent:
    min: 0
    max: 100

  line_sensor:
    count: 5
