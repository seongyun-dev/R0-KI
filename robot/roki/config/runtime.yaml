runtime:
  # Serial이 끊긴 동안 reconnect 여부를 확인하는 주기.
  disconnected_poll_sec: 0.05
  # ACK 유실 시에도 영구 정지 상태에 머물지 않도록 제한적으로 재시도한다.
  encoder_zero_retry_interval_sec: 0.5
  # CP2102 open resets the ESP32. Keep the operating gate closed, but allow
  # enough bounded retries for firmware boot and initial telemetry recovery.
  encoder_zero_max_attempts: 8
  # ACK 뒤 실제 하드웨어 상태가 오지 않으면 열린 포트를 정상으로 간주하지 않는다.
  initial_hardware_status_timeout_sec: 15.0
