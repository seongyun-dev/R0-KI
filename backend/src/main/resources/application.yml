spring:
  application:
    name: oneloop
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB
  config:
    import: optional:classpath:application-secret.yml
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        transport:
          protocol: smtp
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        # TIMESTAMP ↔ LocalDateTime 을 JVM(UTC)이 아니라 서울 벽시계로 해석 (통계 hour3 등)
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    validate-on-migrate: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173
  mqtt:
    client-id: oneloop-backend
  file-storage:
    upload-dir: ${UPLOAD_DIR:uploads}
    url-prefix: /api/uploads
    map-dir: ${MAP_DIR:uploads/maps}

gms:
  base-url: ${GMS_BASE_URL:https://gms.ssafy.io/gmsapi/api.openai.com/v1}
  api-key: ${GMS_KEY:}
  model: ${GMS_MODEL:gpt-5.4-mini}
  chat-completions-path: ${GMS_CHAT_COMPLETIONS_PATH:/chat/completions}
  timeout-seconds: ${GMS_TIMEOUT_SECONDS:120}
  # gpt-5-nano: 추론+본문 합산 예산. 너무 낮으면 content 빈 응답 → 충분히 크게.
  summary-max-completion-tokens: ${GMS_SUMMARY_MAX_COMPLETION_TOKENS:4096}
  insight-max-completion-tokens: ${GMS_INSIGHT_MAX_COMPLETION_TOKENS:16384}

app.email-verification:
  # 가입 시 인증 여부 확인. 메일 서버가 없는 통합 테스트에서만 false 로 끈다.
  # 운영에서는 절대 끄지 않는다 — 끄면 아무 이메일로나 가입할 수 있다.
  enabled: ${APP_EMAIL_VERIFICATION_ENABLED:true}
  # 인증번호 자릿수와 유효시간. 요구사항은 6자리 / 5분이다.
  code-length: ${EMAIL_VERIFICATION_CODE_LENGTH:6}
  ttl-minutes: ${EMAIL_VERIFICATION_TTL_MINUTES:5}
  from: ${MAIL_FROM:${MAIL_USERNAME:no-reply@oneloop.local}}

solapi:
  api-key: ${SOLAPI_API_KEY:}
  api-secret: ${SOLAPI_API_SECRET:}
  sender-number: ${SOLAPI_SENDER_NUMBER:}
