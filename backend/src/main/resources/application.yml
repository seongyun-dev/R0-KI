spring:
  application:
    name: oneloop
  config:
    import: optional:classpath:application-secret.yml
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    validate-on-migrate: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

app:
  cors:
    allowed-origins: http://localhost:3000
  mqtt:
    client-id: oneloop-backend

gms:
  base-url: ${GMS_BASE_URL}
  api-key: ${GMS_KEY}
  model: ${GMS_MODEL}
  chat-completions-path: ${GMS_CHAT_COMPLETIONS_PATH}
  timeout-seconds: ${GMS_TIMEOUT_SECONDS}
