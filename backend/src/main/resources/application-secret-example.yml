# Copy this file to application-secret.yml and replace the example values.
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/oneloop?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: change-me
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  jwt:
    # HS256 requires a secret of at least 32 bytes.
    secret: change-this-to-a-random-secret-at-least-32-bytes-long
    access-token-expiration: 3600000
