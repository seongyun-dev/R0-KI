spring:
  config:
    import: ""
  datasource:
    url: jdbc:h2:mem:oneloop;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: oneloop-test-secret-key-must-be-at-least-32-bytes
    access-token-expiration: 3600000
