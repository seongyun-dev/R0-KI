spring:
  config:
    import: ""
  datasource:
    # CI 및 기본 테스트: H2 in-memory. 로컬 MySQL은 TEST_DATASOURCE_URL 로 override.
    url: ${TEST_DATASOURCE_URL:jdbc:h2:mem:oneloop;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${TEST_DATASOURCE_USERNAME:sa}
    password: ${TEST_DATASOURCE_PASSWORD:}
    driver-class-name: ${TEST_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: oneloop-test-secret-key-must-be-at-least-32-bytes
    access-token-expiration: 3600000
