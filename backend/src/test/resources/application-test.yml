spring:
  config:
    import: ""
  datasource:
    # 통합 테스트는 로컬 Docker MySQL을 사용한다 (H2 MODE=MySQL 미사용).
    url: jdbc:mysql://localhost:3306/aiot_test?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
    username: ${TEST_MYSQL_USER:aiot_local}
    password: ${TEST_MYSQL_PASSWORD:local-password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: oneloop-test-secret-key-must-be-at-least-32-bytes
    access-token-expiration: 3600000
