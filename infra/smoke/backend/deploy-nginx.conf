server {
    listen 8080;
    server_name _;

    location = /swagger-ui.html {
        default_type application/json;
        return 200 '{"status":"UP","component":"backend-deploy-smoke"}';
    }

    location = /actuator/health {
        default_type application/json;
        return 200 '{"status":"UP","component":"backend-deploy-smoke"}';
    }
}
