name: aiot-infra

services:
  mysql:
    image: mysql:8.4
    container_name: aiot-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aiot}
      MYSQL_USER: ${MYSQL_USER:-aiot_app}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - /srv/aiot/data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - aiot-network

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: aiot-mosquitto
    restart: unless-stopped
    ports:
      - "8883:8883"
    volumes:
      - /srv/aiot/config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - /srv/aiot/config/mosquitto/passwd:/mosquitto/config/passwd:ro
      - /srv/aiot/certs/mqtt:/mosquitto/certs:ro
      - /srv/aiot/data/mosquitto:/mosquitto/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - aiot-network

networks:
  aiot-network:
    external: true
    name: aiot-network
