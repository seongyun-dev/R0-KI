server {
    listen 80;
    server_name _;

    location = /integration-health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Keep integration behavior aligned with production for every SSE stream.
    location ~ ^/api/(?:robots/(?:location/events|obstacle-events)|events/subscribe/(?:emergency|general)|map/mapping-sessions/[0-9]+/events)$ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 30m;
        proxy_send_timeout 30m;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        add_header X-Accel-Buffering "no" always;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /v3/api-docs {
        proxy_pass http://backend:8080;
    }

    location /swagger-ui {
        proxy_pass http://backend:8080;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
