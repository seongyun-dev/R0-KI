persistence true
persistence_location /mosquitto/data/
autosave_interval 60
log_dest stdout
connection_messages true

allow_anonymous false
password_file /mosquitto/config/passwd

# Spring uses this listener only through the private Docker network.
listener 1883
protocol mqtt

# Jetson connects here from outside the EC2 host.
listener 8883
protocol mqtt
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
tls_version tlsv1.2
